name: GUI bug report
description: Report a reproducible problem in Command Code GUI
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Command Code GUI. Remove credentials, private source code, and `.env` values from everything you attach.
  - type: input
    id: version
    attributes:
      label: GUI version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - Linux (Debian/Ubuntu)
        - Linux (other)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open…
        2. Click…
        3. Observe…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, recordings, or sanitized logs
      description: Do not include secrets or private project data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private project information from this report.
          required: true
